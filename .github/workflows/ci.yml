name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assetlinks:
    name: Asset links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the asset links checker
        run: node --test 'scripts/**/*.test.mjs'
      - name: Check Android asset links
        run: node scripts/check-assetlinks.mjs docs
