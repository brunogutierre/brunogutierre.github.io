name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assetlinks:
    name: Asset links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the guard scripts
        run: node --test 'scripts/**/*.test.mjs'
      - name: Check Android asset links
        run: node scripts/check-assetlinks.mjs site-root

  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:content
      - run: npm run test:ci
      # Drafts never ship, so the production build has no post pages until the first real post:
      # prerender the draft posts too and check that site, before building the one that ships.
      - name: Build and check with the draft posts
        run: npm run build:drafts && npm run check:dist
      # End-to-end tests run on that site, so the post pages are covered.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - name: End-to-end and accessibility tests
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - run: npm run build
      - name: Check the prerendered site
        run: npm run check:dist
      - name: Check Android asset links in the built site
        run: >-
          node scripts/check-assetlinks.mjs dist/personal-site/browser
          --source site-root/.well-known/assetlinks.json
