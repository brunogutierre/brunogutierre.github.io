name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DIR: dist/personal-site/browser
  ASSETLINKS_SOURCE: site-root/.well-known/assetlinks.json
  SITE_URL: https://brunogutierre.github.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prerenders every language, then (postbuild) adds the root-only files and /404.html.
      - run: npm run build
      - name: Check the prerendered site
        run: npm run check:dist
      # The Advanced Sudoku Android app verifies its App Links against this file:
      # never publish a site without it.
      - name: Check Android asset links
        run: node scripts/check-assetlinks.mjs "$SITE_DIR" --source "$ASSETLINKS_SOURCE"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}
          # Without this, dot folders are left out of the artifact and /.well-known/ disappears.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Asset links
        run: scripts/verify-live-assetlinks.sh "$SITE_URL/.well-known/assetlinks.json" "$ASSETLINKS_SOURCE"
      - name: Home page in every language
        run: |
          for path in / /pt/ /fr/; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 20 --retry-delay 15 --retry-all-errors "$SITE_URL$path"
            echo "OK: $SITE_URL$path"
          done
